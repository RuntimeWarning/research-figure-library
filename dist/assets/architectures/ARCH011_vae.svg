<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#91a0b3"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><text x="36" y="44" font-size="27" fill="#2e3e52" text-anchor="start" dominant-baseline="middle" font-weight="650">Variational Autoencoder</text><text x="37" y="72" font-size="14" fill="#7d8b9e" text-anchor="start" dominant-baseline="middle" font-weight="400">Infer a distribution, sample with reparameterization, and decode</text><g id="module-1"><rect x="35" y="260" width="90" height="75" rx="11" fill="#f1f4f8" stroke="#bdc8d5" stroke-width="1.3"/><text x="80" y="297.5" font-size="17" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Input x</text></g><g id="module-2"><rect x="165" y="260" width="150" height="75" rx="11" fill="#e3edfc" stroke="#a9c2e8" stroke-width="1.3"/><text x="240" y="285.5" font-size="19" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Encoder</text><text x="240" y="309.5" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">q(z | x)</text></g><path d="M125,297.5 L165,297.5" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g id="module-3"><rect x="375" y="170" width="140" height="60" rx="11" fill="#ece5f8" stroke="#bda9dc" stroke-width="1.3"/><text x="445" y="200" font-size="18" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Mean μ</text></g><g id="module-4"><rect x="375" y="350" width="140" height="60" rx="11" fill="#ece5f8" stroke="#bda9dc" stroke-width="1.3"/><text x="445" y="368" font-size="17" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">log σ²</text><text x="445" y="392" font-size="13.2898" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">σ = exp(½ log σ²)</text></g><path d="M315,297 L345,297 L345,200 L375,200" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M315,297 L345,297 L345,380 L375,380" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g id="module-5"><rect x="605" y="250" width="210" height="95" rx="11" fill="#ddf1e9" stroke="#9bc9b7" stroke-width="1.3"/><text x="710" y="285.5" font-size="20" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Sample z</text><text x="710" y="309.5" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">z = μ + σ ⊙ ε</text></g><path d="M515,200 L565,200 L565,276 L605,276" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M515,380 L565,380 L565,319 L605,319" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g id="module-6"><rect x="630" y="120" width="160" height="55" rx="11" fill="#f1f4f8" stroke="#bdc8d5" stroke-width="1.3"/><text x="710" y="147.5" font-size="17" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">ε ~ N(0, I)</text></g><path d="M710,175 L710,250" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g id="module-7"><rect x="865" y="260" width="145" height="75" rx="11" fill="#fcebd9" stroke="#e4bc91" stroke-width="1.3"/><text x="937.5" y="285.5" font-size="19" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Decoder</text><text x="937.5" y="309.5" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">p(x | z)</text></g><g id="module-8"><rect x="1050" y="260" width="90" height="75" rx="11" fill="#f7e3ea" stroke="#dba6bc" stroke-width="1.3"/><text x="1095" y="297.5" font-size="14.8148" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Output x̂</text></g><path d="M815,297.5 L865,297.5" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1010,297.5 L1050,297.5" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g id="module-9"><rect x="355" y="450" width="305" height="60" rx="11" fill="#f1f4f8" stroke="#bdc8d5" stroke-width="1.3"/><text x="507.5" y="468" font-size="17" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">KL regularization</text><text x="507.5" y="492" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">q(z | x) toward N(0, I)</text></g><path d="M445,410 L445,450" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M515,200 L535,200 L535,430 L510,430 L510,450" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="865" y="470" font-size="15" fill="#7d8b9e" text-anchor="middle" dominant-baseline="middle" font-weight="400">Objective = reconstruction + KL</text><path d="M36 522H1134" stroke="#e4e9ef" stroke-width="1"/><text x="37" y="543" font-size="11" fill="#7d8b9e" text-anchor="start" dominant-baseline="middle" font-weight="400">Concept schematic · implementation details omitted · original artwork / MIT</text></g>
