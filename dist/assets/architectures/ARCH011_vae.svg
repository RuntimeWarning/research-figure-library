<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="565" viewBox="0 0 1170 565" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Variational Autoencoder</title>
<desc id="diagram-desc">Original conceptual schematic. Encoder predicts distribution parameters; Gaussian reparameterization z=mu+sigma*epsilon; decoder and KL regularization to a prior. Not a reproduction of a paper figure. MIT.</desc>
