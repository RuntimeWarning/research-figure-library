<title id="diagram-title">ResNet-18</title>
<desc id="diagram-desc">Original conceptual schematic. Four stages of 2 basic blocks each with 64/128/256/512 channels; shortcuts add x to F(x), adapting dimensions when needed. Not a reproduction of a paper figure. MIT.</desc>
