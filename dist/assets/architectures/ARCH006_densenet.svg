dle" font-weight="400">GAP + FC</text></g><path d="M996,164 L1055,164" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="65" y="285" width="1050" height="182" rx="15" fill="none" stroke="#d3dce6" stroke-width="1.1" stroke-dasharray="5 5"/><text x="81" y="303" font-size="12" fill="#7d8b9e" text-anchor="start" dominant-baseline="middle" font-weight="600">DENSE CONNECTIVITY · concatenation, not element-wise addition</text><g id="module-7"><rect x="95" y="366" width="105" height="65" rx="11" fill="#f1f4f8" stroke="#bdc8d5" stroke-width="1.3"/><text x="147.5" y="398.5" font-size="18" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">x₀</text></g><g id="module-8"><rect x="280" y="366" width="170" height="65" rx="11" fill="#e3edfc" stroke="#a9c2e8" stroke-width="1.3"/><text x="365" y="386.5" font-size="18" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">H₁</text><text x="365" y="410.5" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">input: x₀</text></g><g id="module-9"><rect x="515" y="366" width="170" height="65" rx="11" fill="#ece5f8" stroke="#bda9dc" stroke-width="1.3"/><text x="600" y="386.5" font-size="18" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">H₂</text><text x="600" y="410.5" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">input: [x₀, x₁]</text></g><g id="module-10"><rect x="750" y="366" width="170" height="65" rx="11" fill="#ddf1e9" stroke="#9bc9b7" stroke-width="1.3"/><text x="835" y="386.5" font-size="18" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">H₃</text><text x="835" y="410.5" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">input: [x₀, x₁, x₂]</text></g><g id="module-11"><rect x="975" y="366" width="110" height="65" rx="11" fill="#f7e3ea" stroke="#dba6bc" stroke-width="1.3"/><text x="1030" y="386.5" font-size="16" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Concat</text><text x="1030" y="410.5" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">all features</text></g><path d="M200,398.5 L280,398.5" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M450,398.5 L515,398.5" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M685,398.5 L750,398.5" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M920,398.5 L975,398.5" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M220,398 L220,330 L555,330 L555,366" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M220,398 L220,311 L790,311 L790,366" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M470,398 L470,345 L840,345 L840,366" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M220,398 L220,453 L1030,453 L1030,431" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M470,398 L470,453" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M705,398 L705,453" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M36 507H1144" stroke="#e4e9ef" stroke-width="1"/><text x="37" y="528" font-size="11" fill="#7d8b9e" text-a