="middle" font-weight="400">Self-attention + MLP × L</text></g><g id="module-10"><rect x="1060" y="230" width="150" height="85" rx="11" fill="#fcebd9" stroke="#e4bc91" stroke-width="1.3"/><text x="1135" y="260.5" font-size="18" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">MLP head</text><text x="1135" y="284.5" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">CLS state</text></g><circle cx="770" cy="272" r="18" fill="#fcebd9" stroke="#e4bc91" stroke-width="1.4"/><text x="770" y="272.5" font-size="22" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="500">+</text><path d="M745,272 L752,272" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path d="M788,272 L810,272" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1010,272.5 L1060,272.5" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="620" y="385" font-size="14" fill="#7d8b9e" text-anchor="middle" dominant-baseline="middle" font-weight="400">Only the encoded class-token state is sent to the image classifier.</text><path d="M36 407H1204" stroke="#e4e9ef" stroke-width="1"/><text x="37" y="428" font-size="11" fill="#7d8b9e" text-anchor="start" dominant-baseline="middle" font-weight="400">Concept schematic · implementation details omitted · original artwork / MIT</text></g>
