<title id="diagram-title">Vision Transformer · ViT</title>
<desc id="diagram-desc">Original conceptual schematic. Image patches are linearly projected; a learned class token is prepended, position embeddings added, and encoded class state feeds the classifier. Not a reproduction of a paper figure. MIT.</desc>
