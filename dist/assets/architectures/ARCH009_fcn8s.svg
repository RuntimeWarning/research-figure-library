<title id="diagram-title">FCN-8s</title>
<desc id="diagram-desc">Original conceptual schematic. FCN-8s fuses upsampled stride-32 scores with pool4 stride-16 scores, then pool3 stride-8 scores, then upsamples to pixels. Not a reproduction of a paper figure. MIT.</desc>
