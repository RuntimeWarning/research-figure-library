<title id="diagram-title">Sequence-to-sequence · LSTM</title>
<desc id="diagram-desc">Original conceptual schematic. LSTM encoder reads a reversed source sequence into a fixed-size final state; LSTM decoder is conditioned on it and previous target tokens; no attention. Not a reproduction of a paper figure. MIT.</desc>
