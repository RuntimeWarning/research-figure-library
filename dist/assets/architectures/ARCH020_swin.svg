<title id="diagram-title">Swin Transformer</title>
<desc id="diagram-desc">Original conceptual schematic. Alternating regular/shifted-window self-attention; patch merging groups 2x2 tokens, reduces token count fourfold and doubles channels. Not a reproduction of a paper figure. MIT.</desc>
