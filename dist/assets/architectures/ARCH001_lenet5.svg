<title id="diagram-title">LeNet-5</title>
<desc id="diagram-desc">Original conceptual schematic. LeNet-5 has C1/S2/C3/S4/C5/F6 and ten Euclidean RBF output units; subsampling is trainable. Not a reproduction of a paper figure. MIT.</desc>
