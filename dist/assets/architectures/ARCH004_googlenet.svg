r-end="url(#arrow)"/><g id="module-9"><rect x="385" y="362" width="130" height="50" rx="11" fill="#fcebd9" stroke="#e4bc91" stroke-width="1.3"/><text x="450" y="387" font-size="16" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">3 × 3 Pool</text></g><g id="module-10"><rect x="550" y="362" width="145" height="50" rx="11" fill="#fcebd9" stroke="#e4bc91" stroke-width="1.3"/><text x="622.5" y="387" font-size="16" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">1 × 1 Conv</text></g><path d="M290,279 L330,279 L330,387 L385,387" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M515,387 L550,387" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g id="module-11"><rect x="735" y="231" width="85" height="97" rx="11" fill="#f7e3ea" stroke="#dba6bc" stroke-width="1.3"/><text x="777.5" y="267.5" font-size="16" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Concat</text><text x="777.5" y="291.5" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">channels</text></g><path d="M695,174 L715,174 L715,279 L735,279" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M695,245 L715,245 L715,279 L735,279" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M695,316 L715,316 L715,279 L735,279" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M695,387 L715,387 L715,279 L735,279" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g id="module-12"><rect x="890" y="244" width="120" height="70" rx="11" fill="#ddf1e9" stroke="#9bc9b7" stroke-width="1.3"/><text x="950" y="267" font-size="17" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">AvgPool</text><text x="950" y="291" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">global</text></g><g id="module-13"><rect x="1045" y="244" width="160" height="70" rx="11" fill="#fcebd9" stroke="#e4bc91" stroke-width="1.3"/><text x="1125" y="267" font-size="17" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Classifier</text><text x="1125" y="291" font-size="14" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">Linear + Softmax</text></g><path d="M820,279.5 L890,279" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1010,279 L1045,279" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g id="module-14"><rect x="905" y="390" width="275" height="65" rx="11" fill="#f1f4f8" stroke="#bdc8d5" stroke-width="1.3"/><text x="1042.5" y="410.5" font-size="17" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Auxiliary heads × 2</text><text x="1042.5" y="434.5" font-size="13.2202" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">Training only · removed at inference</text></g><path d="M820,300 L867,300 L867,422 L905,422" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M36 497H1204" stroke="#e4e9ef" stroke-width="1"/><text x="37" y="518" font-size="11" fill="#7d8b9e" text-anchor="start" dominant-baseline="middle" font-weight="400">Concept schematic · implementation details omitted · original artwork / MIT</text></g>
