<title id="diagram-title">GoogLeNet / Inception-v1</title>
<desc id="diagram-desc">Original conceptual schematic. Inception-v1 concatenates 1x1, 3x3, 5x5 and pooling branches with dimensionality reduction; nine modules and two training-only auxiliary heads. Not a reproduction of a paper figure. MIT.</desc>
