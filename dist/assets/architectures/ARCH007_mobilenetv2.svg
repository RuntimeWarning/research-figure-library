<title id="diagram-title">MobileNetV2</title>
<desc id="diagram-desc">Original conceptual schematic. 1x1 nonlinear expansion, 3x3 depthwise nonlinear filtering and linear 1x1 projection; thin shortcut only at stride 1 with matching channels. Not a reproduction of a paper figure. MIT.</desc>
