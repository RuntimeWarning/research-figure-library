<title id="diagram-title">VGG-16</title>
<desc id="diagram-desc">Original conceptual schematic. Configuration D uses 2/2/3/3/3 convolution groups of 64/128/256/512/512 channels, five pools and three FC layers. Not a reproduction of a paper figure. MIT.</desc>
