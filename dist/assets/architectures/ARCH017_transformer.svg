<title id="diagram-title">Transformer · encoder–decoder</title>
<desc id="diagram-desc">Original conceptual schematic. Encoder has self-attention/FFN; decoder adds masked self-attention and encoder cross-attention; original post-norm residual structure. Not a reproduction of a paper figure. MIT.</desc>
