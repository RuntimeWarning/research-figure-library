ght="600">Norm</text></g><g id="module-12"><rect x="905" y="395" width="120" height="70" rx="11" fill="#ece5f8" stroke="#bda9dc" stroke-width="1.3"/><text x="965" y="430" font-size="18" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">FFN</text></g><g id="module-13"><rect x="1060" y="395" width="105" height="70" rx="11" fill="#fcebd9" stroke="#e4bc91" stroke-width="1.3"/><text x="1112.5" y="418" font-size="17" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Add &amp;</text><text x="1112.5" y="442" font-size="17" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Norm</text></g><g id="module-14"><rect x="1200" y="395" width="180" height="70" rx="11" fill="#f7e3ea" stroke="#dba6bc" stroke-width="1.3"/><text x="1290" y="418" font-size="17" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="600">Linear + Softmax</text><text x="1290" y="442" font-size="12.5" fill="#2e3e52" text-anchor="middle" dominant-baseline="middle" font-weight="400">next-token probabilities</text></g><path d="M205,430 L250,430" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M405,430 L440,430" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M545,430 L580,430" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M730,430 L765,430" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M870,430 L905,430" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1025,430 L1060,430" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1165,430 L1200,430" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M957,230 L957,320 L655,320 L655,395" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="895" y="304" font-size="13" fill="#7d8b9e" text-anchor="middle" dominant-baseline="middle" font-weight="400">K, V</text><path d="M225,430 L225,510 L492,510 L492,465" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M562,430 L562,530 L817,530 L817,465" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M887,430 L887,550 L1112,550 L1112,465" fill="none" stroke="#91a0b3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="705" y="588" font-size="13" fill="#7d8b9e" text-anchor="middle" dominant-baseline="middle" font-weight="400">Residual paths surround every attention / FFN sublayer; Add &amp; Norm follows each sublayer.</text><path d="M36 597H1384" stroke="#e4e9ef" stroke-width="1"/><text x="37" y="618" font-size="11" fill="#7d8b9e" text-anchor="start" dominant-baseline="middle" font-weight="400">Concept schematic · implementation details omitted · original artwork / MIT</text></g>
